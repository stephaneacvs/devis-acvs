  var S=crypto.subtle, te=new TextEncoder();
  function ub(s){ var b=atob(s), u=new Uint8Array(b.length); for(var i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; }
  function bu(u){ var s=''; for(var i=0;i<u.length;i++) s+=String.fromCharCode(u[i]); return btoa(s); }
  async function openWith(raw){
    var k=await S.importKey('raw',raw,'AES-GCM',false,['decrypt']);
    var html=new TextDecoder().decode(await S.decrypt({name:'AES-GCM',iv:ub(D.iv)},k,ub(D.ct)));
    document.open(); document.write(html); document.close();
  }
  async function unlock(login,pw){
    var h=new Uint8Array(await S.digest('SHA-256',te.encode('dv|'+login.trim().toLowerCase())));
    var id=Array.prototype.map.call(h,function(x){return ('0'+x.toString(16)).slice(-2)}).join('');
    var u=D.u[id]; if(!u) throw 0;
    var base=await S.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveKey']);
    var kek=await S.deriveKey({name:'PBKDF2',salt:ub(u.s),iterations:D.it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    return new Uint8Array(await S.decrypt({name:'AES-GCM',iv:ub(u.iv)},kek,ub(u.w)));
  }
  function ready(){ return new Promise(function(r){ if(document.readyState==='complete') r(); else window.addEventListener('load',function(){ setTimeout(r,0); }); }); }
  (async function(){ var s=null; try{ s=localStorage.getItem('dv-k'); }catch(e){}
    if(!s) return; document.getElementById('f').style.visibility='hidden';
    await ready();
    try{ await openWith(ub(s)); }catch(e){ try{localStorage.removeItem('dv-k')}catch(_){} document.getElementById('f').style.visibility='visible'; } })();
  document.getElementById('f').addEventListener('submit',async function(ev){
    ev.preventDefault(); var b=document.getElementById('b'), e=document.getElementById('e');
    b.disabled=true; b.textContent='Vérification…'; e.textContent='';
    try{ var raw=await unlock(document.getElementById('l').value,document.getElementById('p').value);
      if(document.getElementById('r').checked){ try{ localStorage.setItem('dv-k',bu(raw)); }catch(_){} }
      await ready(); await openWith(raw);
    }catch(x){ e.textContent='Identifiant ou mot de passe incorrect.'; b.disabled=false; b.textContent='Se connecter'; }
  });
})();
