  var S=crypto.subtle;
  var $=function(i){return document.getElementById(i)};
  function ub(s){ var b=atob(s), u=new Uint8Array(b.length); for(var i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; }
  function ready(){ return new Promise(function(r){ if(document.readyState==='complete') r(); else window.addEventListener('load',function(){ setTimeout(r,0); }); }); }
  function get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function set(k,v){ try{ if(v==null) localStorage.removeItem(k); else localStorage.setItem(k,v); }catch(e){} }
  var MSG={identifiants:'Identifiant ou mot de passe incorrect.',desactive:'Cet accès a été désactivé. Contactez votre interlocuteur.',session:'Votre session a expiré, reconnectez-vous.',bloque_temporairement:'Trop de tentatives. Réessayez dans 15 minutes.',requete:'Erreur de connexion, réessayez.',acces:'Votre accès ne comprend pas cet outil. Contactez votre interlocuteur.'};
  async function ask(body){
    body.app=D.app||'note';
    var ctl=new AbortController(), t=setTimeout(function(){ctl.abort()},12000);
    try{ var r=await fetch(D.api,{method:'POST',body:JSON.stringify(body),headers:{'Content-Type':'text/plain;charset=utf-8'},signal:ctl.signal,redirect:'follow'});
      return await r.json(); } finally{ clearTimeout(t); }
  }
  async function openWith(k64){
    var k=await S.importKey('raw',ub(k64),'AES-GCM',false,['decrypt']);
    var html=new TextDecoder().decode(await S.decrypt({name:'AES-GCM',iv:ub(D.iv)},k,ub(D.ct)));
    await ready(); document.open(); document.write(html); document.close();
  }
  function cur(login,jeton,r){ try{ sessionStorage.setItem('dv-cur',JSON.stringify({api:D.api,login:login,jeton:jeton,max:r.max==null?null:r.max,faits:r.faits||0})); }catch(e){} }
  function showForm(msg){ $('f').style.visibility='visible'; $('e').textContent=msg||''; }
  (async function(){
    var s=null; try{ s=JSON.parse(get('dv-s')||'null'); }catch(e){}
    if(!s||!s.login||!s.jeton) return;
    $('f').style.visibility='hidden'; $('l').value=s.login;
    var r=null; try{ r=await ask({login:s.login,jeton:s.jeton}); }catch(e){ r=null; }
    if(r&&r.ok){ set('dv-k',r.k); cur(s.login,s.jeton,r); try{ await openWith(r.k); return; }catch(e){ showForm(MSG.requete); return; } }
    if(r&&!r.ok){ set('dv-s',null); set('dv-k',null); showForm(MSG[r.motif]||MSG.identifiants); return; }
    var c=get('dv-k'); if(c){ cur(s.login,s.jeton,{max:s.max===undefined?-1:s.max}); try{ await openWith(c); return; }catch(e){} }   // hors ligne : dernière clé connue
    showForm('Pas de connexion internet : impossible de vérifier votre accès.');
  })();
  $('f').addEventListener('submit',async function(ev){
    ev.preventDefault(); var b=$('b');
    b.disabled=true; b.textContent='Vérification…'; $('e').textContent='';
    var login=$('l').value.trim(), garder=$('r').checked;
    try{ var r=await ask({login:login,pw:$('p').value});
      if(!r.ok){ $('e').textContent=MSG[r.motif]||MSG.identifiants; b.disabled=false; b.textContent='Se connecter'; return; }
      if(garder&&r.jeton){ set('dv-s',JSON.stringify({login:login,jeton:r.jeton,max:r.max==null?null:r.max})); set('dv-k',r.k); } else { set('dv-s',null); set('dv-k',null); }
      cur(login,r.jeton,r);
      await openWith(r.k);
    }catch(x){ $('e').textContent='Connexion impossible. Vérifiez votre accès internet.'; b.disabled=false; b.textContent='Se connecter'; }
  });
})();
